[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-decision-agent"
version = "0.1.0"
description = "Coding_Decision_Agent: Laya (ModernBERT-large + RLCD decision head) fine-tuned as a calibrated grader for code changes, tool calls, agent traces and model/skill routing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "S4MPL3BI4S" }]
keywords = ["laya", "decision-model", "code-review", "tool-calling", "llm-routing", "rlcd", "calibration"]

# Runtime deps for the SDK (inference only).
dependencies = [
    "laya>=0.3.7",
    "torch>=2.1.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.24.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Data building, teacher labelling, training, evaluation and publishing (RunPod side).
train = [
    "datasets>=2.19.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "tqdm>=4.66",
    "peft>=0.11.0",
    "requests>=2.31",
]
teacher = [
    "vllm>=0.6.0",
    "openai>=1.30",
]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[tool.setuptools]
packages = ["coding_decision_agent"]
package-dir = { "coding_decision_agent" = "sdk/coding_decision_agent" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
