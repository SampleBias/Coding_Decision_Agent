[package]
name = "cda-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal test suite for the Laya Coding Decision Agent"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
