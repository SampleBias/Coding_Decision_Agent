# Training configuration for train/train_rlcd.py.
# Select a profile with --profile <name> (or TRAIN_PROFILE env). `common` is merged under it.

common:
  base_model: convaiinnovations/laya          # HF repo of the checkpoint to start from
  base_revision: null                         # pin a revision if desired
  model_name: coding-decision-agent           # written into rl_agent_config.json
  seed: 20260928

  # Sequence budget. head_max_len is shared by all options of a question; the rest is state.
  max_len: 2048
  head_max_len: 320

  # RLCD recipe (mirrors the official notebook).
  epochs: 3
  group_size: 4              # GRPO samples per item
  sigma_start: 0.4           # exploration noise, annealed linearly per epoch
  sigma_end: 0.1
  w_sph: 0.75                # spherical score weight in proper_reward
  w_rps: 1.0                 # ranked probability score weight
  ce_weight: 1.0             # soft cross-entropy weight
  lr_encoder: 2.5e-5
  lr_head: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  grad_clip: 1.0
  eta_min: 1.0e-6

  # Calibration slice held out BEFORE training (never enters a batch).
  calib_max_per_family: 400
  calib_fraction: 0.10

  # Per-family sampling weights applied when building epochs (1.0 = natural frequency).
  family_weights:
    code_review: 1.0
    tool_call: 1.0
    agent_trace: 2.0        # small family; upweight
    routing: 1.0

  # Logging / checkpoints
  log_every: 50
  save_every_epoch: true
  wandb: false

profiles:
  a100_80gb:
    micro_batch: 16
    grad_accum: 4            # effective 64 sequences per update per GPU
    max_tokens_per_batch: 16384
    dtype: bf16
    gradient_checkpointing: false
    lora: false

  gpu_24gb:
    micro_batch: 4
    grad_accum: 16
    max_tokens_per_batch: 6144
    dtype: fp16
    gradient_checkpointing: true
    max_len: 1024
    head_max_len: 256
    lora: true
    lora_r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    lora_targets: ["Wqkv", "Wo", "Wi"]   # ModernBERT linear layer names

  smoke:                     # CPU / tiny GPU smoke test on a handful of items
    micro_batch: 2
    grad_accum: 1
    max_tokens_per_batch: 2048
    dtype: fp32
    gradient_checkpointing: false
    lora: false
    epochs: 1
    max_items: 16
    max_len: 512
    head_max_len: 192
